<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Fundo integrado -->
  <rect width="500" height="400" fill="#0d1b2a"/>

  <!-- Nuvens Cartoon (redondas) -->
  <path d="M 70 120 Q 70 90 100 90 Q 120 70 150 90 Q 180 90 170 120 Z" fill="#1e293b"/>
  <path d="M 430 140 Q 430 110 400 110 Q 380 90 350 110 Q 320 110 330 140 Z" fill="#1e293b"/>

  <!-- Gaivotas Minimalistas -->
  <path d="M 370 70 Q 385 55 400 70 Q 415 55 430 70" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 80 60 Q 90 50 100 60 Q 110 50 120 60" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- ==========================================
       TEXTO TOURISM UP (EFEITO 3D/STICKER)
       ========================================== -->
  <g transform="translate(0, 0)">
    <text x="250" y="85" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', 'Fredoka One', sans-serif" font-size="64" font-weight="900" text-anchor="middle" stroke="#050a10" stroke-width="20" stroke-linejoin="round">TOURISMUP</text>
    <text x="250" y="85" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', 'Fredoka One', sans-serif" font-size="64" font-weight="900" text-anchor="middle">
      <tspan fill="#ffffff">TOURISM</tspan><tspan fill="#fbbf24">UP</tspan>
    </text>
    <text x="250" y="81" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', 'Fredoka One', sans-serif" font-size="64" font-weight="900" text-anchor="middle">
      <tspan fill="#ffffff">TOURISM</tspan><tspan fill="#fde047">UP</tspan>
    </text>
  </g>

  <!-- ==========================================
       A PONTE D. LUÍS I 
       ========================================== -->
  <!-- Cabos de Suspensão Verticais -->
  <g stroke="#050a10" stroke-width="8" stroke-linecap="round">
    <line x1="170" y1="160" x2="170" y2="290"/>
    <line x1="210" y1="160" x2="210" y2="290"/>
    <line x1="250" y1="160" x2="250" y2="290"/>
    <line x1="290" y1="160" x2="290" y2="290"/>
    <line x1="330" y1="160" x2="330" y2="290"/>
  </g>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <line x1="170" y1="160" x2="170" y2="290"/>
    <line x1="210" y1="160" x2="210" y2="290"/>
    <line x1="250" y1="160" x2="250" y2="290"/>
    <line x1="290" y1="160" x2="290" y2="290"/>
    <line x1="330" y1="160" x2="330" y2="290"/>
  </g>

  <!-- Pilares de Granito (Ribeira / Gaia) com textura de blocos -->
  <rect x="70" y="160" width="50" height="160" rx="4" fill="#64748b" stroke="#050a10" stroke-width="8"/>
  <rect x="380" y="160" width="50" height="160" rx="4" fill="#64748b" stroke="#050a10" stroke-width="8"/>
  
  <!-- Textura de pedra nos pilares -->
  <g stroke="#050a10" stroke-width="4" opacity="0.4" stroke-linecap="round">
    <!-- Pilar Esquerdo -->
    <line x1="75" y1="195" x2="115" y2="195"/>
    <line x1="75" y1="230" x2="115" y2="230"/>
    <line x1="75" y1="265" x2="115" y2="265"/>
    <line x1="95" y1="195" x2="95" y2="230"/>
    <!-- Pilar Direito -->
    <line x1="385" y1="195" x2="425" y2="195"/>
    <line x1="385" y1="230" x2="425" y2="230"/>
    <line x1="385" y1="265" x2="425" y2="265"/>
    <line x1="405" y1="230" x2="405" y2="265"/>
  </g>

  <!-- O GRANDE ARCO DE FERRO DUPLO -->
  <path d="M 100 310 Q 250 50 400 310" fill="none" stroke="#050a10" stroke-width="14" stroke-linecap="round"/>
  <path d="M 100 310 Q 250 50 400 310" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <path d="M 70 310 Q 250 10 430 310" fill="none" stroke="#050a10" stroke-width="14" stroke-linecap="round"/>
  <path d="M 70 310 Q 250 10 430 310" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>

  <!-- Treliças do Arco -->
  <g stroke="#050a10" stroke-width="5" stroke-linecap="round">
    <line x1="130" y1="255" x2="155" y2="215"/>
    <line x1="170" y1="210" x2="190" y2="175"/>
    <line x1="210" y1="175" x2="230" y2="155"/>
    <line x1="270" y1="155" x2="290" y2="175"/>
    <line x1="310" y1="175" x2="330" y2="210"/>
    <line x1="345" y1="215" x2="370" y2="255"/>
  </g>
  <g stroke="#0ea5e9" stroke-width="2" stroke-linecap="round">
    <line x1="130" y1="255" x2="155" y2="215"/>
    <line x1="170" y1="210" x2="190" y2="175"/>
    <line x1="210" y1="175" x2="230" y2="155"/>
    <line x1="270" y1="155" x2="290" y2="175"/>
    <line x1="310" y1="175" x2="330" y2="210"/>
    <line x1="345" y1="215" x2="370" y2="255"/>
  </g>

  <!-- Tabuleiros -->
  <rect x="110" y="282" width="280" height="14" rx="6" fill="#e2e8f0" stroke="#050a10" stroke-width="8"/>
  <rect x="40" y="152" width="420" height="14" rx="6" fill="#e2e8f0" stroke="#050a10" stroke-width="8"/>

  <!-- ==========================================
       METRO DO PORTO
       ========================================== -->
  <rect x="180" y="122" width="140" height="26" rx="13" fill="#facc15" stroke="#050a10" stroke-width="6"/>
  <rect x="185" y="140" width="130" height="6" fill="#1e293b"/>
  <rect x="195" y="127" width="110" height="10" rx="4" fill="#050a10"/>
  <!-- Reflexos nos Vidros -->
  <line x1="205" y1="129" x2="225" y2="135" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="260" y1="129" x2="270" y2="135" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Farol do Metro -->
  <circle cx="310" cy="138" r="3" fill="#ffffff"/>
  <path d="M 312 138 L 335 125 L 335 151 Z" fill="#fef08a" opacity="0.4"/>

  <!-- ==========================================
       O RIO DOURO E O BARCO RABELO
       ========================================== -->
  <!-- Onda Traseira Escura -->
  <path d="M 0 320 Q 40 300 80 320 T 160 320 T 240 320 T 320 320 T 400 320 T 480 320 L 500 320 L 500 400 L 0 400 Z" fill="#0284c7" stroke="#050a10" stroke-width="6"/>

  <!-- BARCO RABELO (Entre as ondas) -->
  <g transform="translate(240, 310)">
    <!-- Vela -->
    <path d="M 40 10 L 15 25 L 65 25 Z" fill="#f8fafc" stroke="#050a10" stroke-width="4" stroke-linejoin="round"/>
    <!-- Mastro -->
    <line x1="40" y1="10" x2="40" y2="35" stroke="#050a10" stroke-width="3" stroke-linecap="round"/>
    <!-- Casco -->
    <path d="M 5 25 L 75 25 L 65 40 L 15 40 Z" fill="#b45309" stroke="#050a10" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Onda Frontal Clara -->
  <path d="M 0 345 Q 50 325 100 345 T 200 345 T 300 345 T 400 345 T 500 345 L 500 400 L 0 400 Z" fill="#38bdf8" stroke="#050a10" stroke-width="6"/>
</svg>
