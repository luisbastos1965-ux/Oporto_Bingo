<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oporto Bin'Go</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="./bingo-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-left-controls">
        <button id="btn-help" class="top-icon-btn" onclick="openHelpModal()">❔</button>
        <button id="btn-lang" class="top-icon-btn" onclick="cycleLanguage()">🇵🇹</button>
    </div>
    
    <div id="gps-status" class="gps-dot searching" title="A procurar GPS..."></div>
    <button id="btn-hint" class="fab-hint" onclick="showHint()">🧭</button>

    <div id="splash-screen">
        <video id="splash-video" autoplay muted playsinline>
            <source src="./assets/intro.mp4" type="video/mp4">
        </video>
    </div>

    <header>
        <h1>OPORTO</h1>
    </header>

    <main>
        <div id="bingo-grid" class="grid hidden"></div>
    </main>

    <footer>
        <h2 class="hidden">Bin'Go</h2>
    </footer>

    <audio id="unlock-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="open-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

    <div id="location-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close">×</span>
            <h2 id="modal-title">Título</h2>
            <img id="modal-image" src="" alt="Local">
            
            <div id="modal-tabs" class="tabs">
                <button id="tab-btn-resumo" class="tab-btn active" onclick="openTab(event, 'tab-resumo')">Resumo</button>
                <button id="tab-btn-historia" class="tab-btn" onclick="openTab(event, 'tab-historia')">História</button>
                <button id="tab-btn-curiosidades" class="tab-btn" onclick="openTab(event, 'tab-curiosidades')">Curiosidades</button>
            </div>

            <div id="tab-resumo" class="tab-content active">
                <p id="modal-desc"></p>
            </div>
            <div id="tab-historia" class="tab-content">
                <p id="modal-hist"></p>
            </div>
            <div id="tab-curiosidades" class="tab-content">
                <p id="modal-curio"></p>
            </div>

            <div id="modal-actions" class="actions-bar">
                <button id="btn-map" class="action-btn" onclick="openMap()">📍 Como Chegar</button>
                <button id="btn-audio" class="action-btn hidden" onclick="toggleAudio()">🔊 Ouvir Textos</button>
            </div>
        </div>
    </div>

    <div id="help-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-help" class="close">×</span>
            <h2>Como Jogar</h2>
            <div class="help-text">
                <p>🚶‍♂️ Caminha pela cidade para explorar.</p>
                <p>🟧 <b>Laranja:</b> Estás a menos de 400m!</p>
                <p>🟥 <b>Vermelho (A pulsar):</b> Menos de 150m!</p>
                <p>🔓 <b>Desbloqueio:</b> Aproxima-te a 50m.</p>
            </div>
        </div>
    </div>

    <script src="sw.js"></script>
    <script src="app.js"></script>
</body>
</html>
